name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Release version in X.Y.Z form
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: CI / ${{ matrix.label }} — Blender 5.2
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            label: Windows
            platform: windows
          - runner: ubuntu-24.04
            label: Linux
            platform: linux
          - runner: macos-15
            label: macOS
            platform: macos
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify and extract Blender 5.2.0
        id: blender
        shell: pwsh
        run: >-
          python scripts/ci.py prepare-blender
          --platform '${{ matrix.platform }}'
          --output-dir '${{ runner.temp }}/blender-5.2.0'
          --github-output $env:GITHUB_OUTPUT

      - name: Run unit tests
        shell: pwsh
        run: >-
          & '${{ steps.blender.outputs.python }}'
          -m unittest discover -s tests/unit -t . -v

      - name: Run headless Blender tests
        shell: pwsh
        run: >-
          & '${{ steps.blender.outputs.blender }}'
          --factory-startup --background --disable-autoexec
          --python-exit-code 1 --python tests/blender/run_all.py

      - name: Validate extension source
        shell: pwsh
        run: >-
          & '${{ steps.blender.outputs.blender }}'
          --factory-startup --command extension validate addon

      - name: Build extension ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force `
            -Path '${{ runner.temp }}/release' | Out-Null
          & '${{ steps.blender.outputs.blender }}' `
            --factory-startup --command extension build `
            --source-dir addon --output-dir '${{ runner.temp }}/release'

      - name: Validate extension ZIP
        shell: pwsh
        run: |
          $Archives = @(
            Get-ChildItem `
              -LiteralPath '${{ runner.temp }}/release' `
              -Filter 'alpha_material_separator-*.zip' `
              -File
          )
          if ($Archives.Count -ne 1) {
            throw "Expected one AMS ZIP, found $($Archives.Count)."
          }
          & '${{ steps.blender.outputs.blender }}' `
            --factory-startup --command extension validate `
            $Archives[0].FullName
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

  release_gate:
    name: Release input gate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Require manifest release version
        shell: pwsh
        run: >-
          python scripts/ci.py check-release
          --version $env:RELEASE_VERSION
          --manifest addon/blender_manifest.toml

  release_package:
    name: Build verified release package
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.visibility == 'public'
    needs: [validate, release_gate]
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      archive_name: ${{ steps.release.outputs.archive_name }}
      sha256: ${{ steps.release.outputs.sha256 }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Fetch exact public source without credentials
        shell: pwsh
        env:
          SOURCE_REPOSITORY: https://github.com/${{ github.repository }}.git
          SOURCE_SHA: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: 0
        run: |
          git init .
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not initialize the release workspace.'
          }
          git remote add origin $env:SOURCE_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not configure the public source remote.'
          }
          git fetch --no-tags --depth=1 origin $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not fetch the exact release commit.'
          }
          git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not check out the exact release commit.'
          }
          $Actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not read the checked-out release commit.'
          }
          if ($Actual.Trim() -ne $env:SOURCE_SHA) {
            throw 'Checked-out release commit does not match GITHUB_SHA.'
          }

      - name: Verify and extract Blender 5.2.0
        id: blender
        shell: pwsh
        run: >-
          python scripts/ci.py prepare-blender
          --platform windows
          --output-dir '${{ runner.temp }}/blender-5.2.0'
          --github-output $env:GITHUB_OUTPUT

      - name: Build fresh extension ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force `
            -Path '${{ runner.temp }}/release' | Out-Null
          & '${{ steps.blender.outputs.blender }}' `
            --factory-startup --command extension build `
            --source-dir addon --output-dir '${{ runner.temp }}/release'

      - name: Validate fresh extension ZIP
        shell: pwsh
        run: >-
          & '${{ steps.blender.outputs.blender }}'
          --factory-startup --command extension validate
          "${{ runner.temp }}/release/alpha_material_separator-${env:RELEASE_VERSION}.zip"

      - name: Prepare release identity and checksum
        id: release
        shell: pwsh
        run: >-
          python scripts/ci.py prepare-release
          --version $env:RELEASE_VERSION
          --manifest addon/blender_manifest.toml
          --archive "${{ runner.temp }}/release/alpha_material_separator-${env:RELEASE_VERSION}.zip"
          --checksum-output '${{ runner.temp }}/release/SHA256SUMS.txt'
          --github-output $env:GITHUB_OUTPUT

      - name: Upload release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ams-release-package
          path: |
            ${{ runner.temp }}/release/${{ steps.release.outputs.archive_name }}
            ${{ runner.temp }}/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release_attestation:
    name: Attest verified release package
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.visibility == 'public'
    needs: [release_package]
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_ARTIFACT_NAME: ams-release-package
      ARCHIVE_NAME: ${{ needs.release_package.outputs.archive_name }}
      EXPECTED_SHA256: ${{ needs.release_package.outputs.sha256 }}
    steps:
      - name: Download and verify release package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $DownloadDirectory = '${{ runner.temp }}/downloaded-release'
          New-Item -ItemType Directory -Path $DownloadDirectory | Out-Null
          gh run download $env:GITHUB_RUN_ID `
            --repo $env:GITHUB_REPOSITORY `
            --name $env:RELEASE_ARTIFACT_NAME `
            --dir $DownloadDirectory
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not download the current release package.'
          }
          $Entries = @(
            Get-ChildItem -LiteralPath $DownloadDirectory -Force
          )
          $ExpectedNames = @($env:ARCHIVE_NAME, 'SHA256SUMS.txt')
          $Unexpected = @(
            $Entries | Where-Object { $_.Name -notin $ExpectedNames }
          )
          if ($Entries.Count -ne 2 -or $Unexpected.Count -ne 0) {
            throw 'Release package must contain exactly the expected ZIP and checksum.'
          }
          $Archive = Join-Path $DownloadDirectory $env:ARCHIVE_NAME
          $ChecksumPath = Join-Path $DownloadDirectory 'SHA256SUMS.txt'
          if (-not (Test-Path -LiteralPath $Archive -PathType Leaf) -or
              -not (Test-Path -LiteralPath $ChecksumPath -PathType Leaf)) {
            throw 'Release package is missing the expected ZIP or checksum.'
          }
          $Actual = (Get-FileHash -LiteralPath $Archive -Algorithm SHA256).Hash
          $Actual = $Actual.ToLowerInvariant()
          if ($Actual -ne $env:EXPECTED_SHA256) {
            throw 'Release package ZIP does not match the verified build digest.'
          }
          $ExpectedChecksum = "$($env:EXPECTED_SHA256)  $($env:ARCHIVE_NAME)"
          $ActualChecksum = (Get-Content -LiteralPath $ChecksumPath -Raw).Trim()
          if ($ActualChecksum -ne $ExpectedChecksum) {
            throw 'Release checksum does not identify the verified ZIP.'
          }

      - name: Attest verified extension ZIP
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: '${{ runner.temp }}/downloaded-release/${{ needs.release_package.outputs.archive_name }}'

  release_publish:
    name: Publish attested release
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.visibility == 'public'
    needs: [release_package, release_attestation]
    runs-on: windows-2025
    timeout-minutes: 10
    # The tag-absence check and the mutation that relies on it are in the same
    # job but not in the same instant. Two dispatches can both pass the check
    # before either creates the tag, so only one may hold this job at a time.
    # Never cancel: an interrupted publish is the state this job exists to
    # avoid, so a second dispatch queues behind the first instead.
    concurrency:
      group: alpha-material-separator-release-publish
      cancel-in-progress: false
    environment: release
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_ARTIFACT_NAME: ams-release-package
      RELEASE_TAG: ${{ needs.release_package.outputs.tag }}
      ARCHIVE_NAME: ${{ needs.release_package.outputs.archive_name }}
      EXPECTED_SHA256: ${{ needs.release_package.outputs.sha256 }}
    steps:
      - name: Download and verify attested package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $DownloadDirectory = '${{ runner.temp }}/downloaded-release'
          New-Item -ItemType Directory -Path $DownloadDirectory | Out-Null
          gh run download $env:GITHUB_RUN_ID `
            --repo $env:GITHUB_REPOSITORY `
            --name $env:RELEASE_ARTIFACT_NAME `
            --dir $DownloadDirectory
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not download the attested release package.'
          }
          $Entries = @(
            Get-ChildItem -LiteralPath $DownloadDirectory -Force
          )
          $ExpectedNames = @($env:ARCHIVE_NAME, 'SHA256SUMS.txt')
          $Unexpected = @(
            $Entries | Where-Object { $_.Name -notin $ExpectedNames }
          )
          if ($Entries.Count -ne 2 -or $Unexpected.Count -ne 0) {
            throw 'Release package must contain exactly the expected ZIP and checksum.'
          }
          $Archive = Join-Path $DownloadDirectory $env:ARCHIVE_NAME
          $ChecksumPath = Join-Path $DownloadDirectory 'SHA256SUMS.txt'
          if (-not (Test-Path -LiteralPath $Archive -PathType Leaf) -or
              -not (Test-Path -LiteralPath $ChecksumPath -PathType Leaf)) {
            throw 'Release package is missing the expected ZIP or checksum.'
          }
          $Actual = (Get-FileHash -LiteralPath $Archive -Algorithm SHA256).Hash
          $Actual = $Actual.ToLowerInvariant()
          if ($Actual -ne $env:EXPECTED_SHA256) {
            throw 'Attested package ZIP does not match the verified build digest.'
          }
          $ExpectedChecksum = "$($env:EXPECTED_SHA256)  $($env:ARCHIVE_NAME)"
          $ActualChecksum = (Get-Content -LiteralPath $ChecksumPath -Raw).Trim()
          if ($ActualChecksum -ne $ExpectedChecksum) {
            throw 'Release checksum does not identify the verified ZIP.'
          }

      - name: Refuse an existing tag or release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Owner, $Name = $env:GITHUB_REPOSITORY.Split('/', 2)
          $Query = @'
          query($owner:String!, $name:String!, $ref:String!, $tag:String!) {
            repository(owner:$owner, name:$name) {
              ref(qualifiedName:$ref) { name }
              release(tagName:$tag) { id }
            }
          }
          '@
          $Tag = $env:RELEASE_TAG
          $State = gh api graphql -f query=$Query `
            -f owner=$Owner -f name=$Name -f ref="refs/tags/$Tag" -f tag=$Tag |
            ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not verify tag and release absence.'
          }
          if ($State.data.repository.ref) {
            throw 'Release tag already exists.'
          }
          if ($State.data.repository.release) {
            throw 'Release already exists.'
          }

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --draft --generate-notes `
            --title $env:RELEASE_TAG `
            --target '${{ github.sha }}'
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not create the draft release.'
          }

      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DOWNLOAD_DIRECTORY: ${{ runner.temp }}/downloaded-release
        run: |
          $Archive = Join-Path $env:DOWNLOAD_DIRECTORY $env:ARCHIVE_NAME
          $Checksum = Join-Path $env:DOWNLOAD_DIRECTORY 'SHA256SUMS.txt'
          gh release upload $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            $Archive $Checksum
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not upload the release assets.'
          }

      - name: Download and verify stored ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $StoredDirectory = '${{ runner.temp }}/stored-release'
          New-Item -ItemType Directory -Path $StoredDirectory | Out-Null
          gh release download $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --pattern $env:ARCHIVE_NAME `
            --dir $StoredDirectory
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not download the stored draft ZIP.'
          }
          $StoredArchive = Join-Path $StoredDirectory $env:ARCHIVE_NAME
          $StoredSha256 = (
            Get-FileHash -LiteralPath $StoredArchive -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          if ($StoredSha256 -ne $env:EXPECTED_SHA256) {
            throw 'Stored draft ZIP does not match the attested package digest.'
          }

      - name: Publish verified and attested draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --draft=false
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not publish the verified and attested release.'
          }
